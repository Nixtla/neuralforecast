name: Exogenous model integration

on:
  push:
    branches: ['feat/exogenous-models-*']
  pull_request:
    paths:
      - 'neuralforecast/models/_exogenous.py'
      - 'neuralforecast/models/crosslinear.py'
      - 'neuralforecast/models/timerxl.py'
      - 'neuralforecast/models/tinytimemixer.py'
      - 'neuralforecast/models/foundation.py'
      - 'neuralforecast/models/_uni2ts_worker.py'
      - 'neuralforecast/models/__init__.py'
      - 'neuralforecast/__init__.py'
      - 'tests/test_exogenous_models.py'
      - '.github/workflows/exogenous-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [core, ttm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: Install official TTM backend
        if: matrix.backend == 'ttm'
        run: python -m pip install granite-tsfm
      - name: Check native models, backend contracts, and NF integration
        if: matrix.backend == 'core'
        run: python -m pytest -q -o addopts='' tests/test_exogenous_models.py -m 'not optional'
      - name: Check actual official TTM without pretrained download
        if: matrix.backend == 'ttm'
        run: python -m pytest -q -o addopts='' tests/test_exogenous_models.py -m optional
