name: Auto search-space tests

on:
  pull_request:
    paths:
      - 'neuralforecast/auto.py'
      - 'neuralforecast/auto_external.py'
      - 'neuralforecast/common/**'
      - 'neuralforecast/models/**'
      - 'tests/test_auto*.py'
      - '.github/workflows/auto-search-space-tests.yml'
  push:
    branches: [main]
    paths:
      - 'neuralforecast/auto.py'
      - 'neuralforecast/auto_external.py'
      - 'neuralforecast/common/**'
      - 'neuralforecast/models/**'
      - 'tests/test_auto*.py'
      - '.github/workflows/auto-search-space-tests.yml'

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest transformers
      - name: Test all Auto space families
        run: |
          python -m pytest -o addopts='' -q tests/test_auto_search_spaces.py tests/test_auto_external.py tests/test_auto_external_registry.py
      - name: Check Optuna integration and configuration regressions
        run: |
          python -m pytest -o addopts='' -q tests/test_common/test_base_auto.py -k 'optuna or validation_default or instantiation or missing_required'
