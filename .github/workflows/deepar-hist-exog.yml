name: DeepAR historical exogenous regression

on:
  push:
    branches: ['feat/deepar-hist-exog-*']
  pull_request:
    paths:
      - 'neuralforecast/models/deepar.py'
      - 'neuralforecast/common/_base_model.py'
      - 'tests/test_models/test_deepar.py'
      - '.github/workflows/deepar-hist-exog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: Test historical inputs, masking, and fit/predict
        run: >-
          python -m pytest -q -o addopts='' tests/test_models/test_deepar.py
          -k hist_exog
