name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest-xlarge, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Clone repo
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --group aws --extra spark

      - name: Configure Visual C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Run ESRNN native tests (windows)
        if: runner.os == 'Windows'
        run: uv run pytest tests/test_models/test_esrnn_speed.py --no-cov

      - name: Run pytest (macos)
        if: runner.os == 'macOS'
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: 1
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: 0.0
        run: uv run pytest --ignore tests/test_common --ignore tests/test_models --ignore tests/test_core.py --no-cov

      - name: Run pytest (ubuntu and windows)
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest')
        run: uv run pytest
